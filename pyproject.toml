[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsfusion"
version = "0.1.0"
description = "A modular, reproducible platform for multi-omics data analysis and integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OmicsFusion Contributors" }]
keywords = ["bioinformatics", "multi-omics", "transcriptomics", "proteomics", "metabolomics", "microbiome"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scikit-bio>=0.5.9; platform_system != 'Windows'",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "networkx>=3.2",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
deep = ["torch>=2.1"]
umap = ["umap-learn>=0.5"]
gui = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.0", "mypy>=1.9"]

[project.scripts]
omicsfusion = "omicsfusion.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omicsfusion = ["reporting/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
