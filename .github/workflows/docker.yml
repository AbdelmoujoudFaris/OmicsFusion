name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t omicsfusion:ci .

      - name: Smoke test
        run: docker run --rm omicsfusion:ci --version
